version: 2
updates:
  - package-ecosystem: "npm"
    directory: "frontend/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      minor-frontend:
        update-types:
          - "minor"
    open-pull-requests-limit: 1

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      minor-gh-actions:
        update-types:
          - "minor"
    open-pull-requests-limit: 1

  - package-ecosystem: "pip"
    directory: "shared_requirements/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "grpcio-status"
        versions: [">= 1.72.0"]
      # Both require protobuf 6; we pin protobuf<6 in requirements.txt
      - dependency-name: "googleapis-common-protos"
        versions: [">= 1.76.0"]
      - dependency-name: "proto-plus"
        versions: [">= 1.29.0"]
    groups:
      minor-python:
        update-types:
          - "minor"
    open-pull-requests-limit: 1

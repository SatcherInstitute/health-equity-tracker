# Proves the AI insight generation path works end to end. Fails when every
# chain entry is unavailable, signaling that insight cards are silently broken
# in production. A cache hit tells you nothing about the provider path; this
# workflow forces a live generation so a broken provider is caught the day it
# breaks rather than a month later.
#
# Auth: the INSIGHT_ADMIN_TOKEN GitHub secret must match the insight-admin-token
# Secret Manager value in each project, which Terraform wires into frontend-service
# as ADMIN_TOKEN (config/run.tf). Rotate both together, or the canary silently falls
# back to serving a cached response and proves nothing.
# See server/CLAUDE.md "Insight generation" for deployment details.
name: CRON Nightly Insight Canary

on:
  schedule:
    - cron: "0 13 * * *" # Daily at 1PM UTC (9AM EST)
  workflow_dispatch:

jobs:
  canary:
    if: github.repository == 'SatcherInstitute/health-equity-tracker'
    name: Force one uncached insight generation per environment
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: server/testdata/insight_prompts/card_table_general_population.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check dev insight generation
        id: check-dev
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.INSIGHT_ADMIN_TOKEN }}
        run: |
          STATUS=$(curl -s -o /tmp/dev-insight.json -w "%{http_code}" \
            -X POST "https://dev.healthequitytracker.org/insight?force=true" \
            -H "Content-Type: application/json" \
            -H "Origin: https://dev.healthequitytracker.org" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -d @server/testdata/insight_prompts/card_table_general_population.json)
          echo "HTTP $STATUS"
          cat /tmp/dev-insight.json; echo
          [ "$STATUS" = "200" ] || { echo "Unexpected HTTP $STATUS"; exit 1; }
          python3 -c "
          import json, sys
          r = json.load(open('/tmp/dev-insight.json'))
          if 'content' not in r:
              print('ERROR: no content in response:', json.dumps(r))
              sys.exit(1)
          if not r.get('forced'):
              print('ERROR: forced=true not in response — token misconfigured or server serving from cache:', json.dumps(r))
              sys.exit(1)
          print('OK: insight generated')
          "

      - name: Check prod insight generation
        id: check-prod
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.INSIGHT_ADMIN_TOKEN }}
        run: |
          STATUS=$(curl -s -o /tmp/prod-insight.json -w "%{http_code}" \
            -X POST "https://healthequitytracker.org/insight?force=true" \
            -H "Content-Type: application/json" \
            -H "Origin: https://healthequitytracker.org" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -d @server/testdata/insight_prompts/card_table_general_population.json)
          echo "HTTP $STATUS"
          cat /tmp/prod-insight.json; echo
          [ "$STATUS" = "200" ] || { echo "Unexpected HTTP $STATUS"; exit 1; }
          python3 -c "
          import json, sys
          r = json.load(open('/tmp/prod-insight.json'))
          if 'content' not in r:
              print('ERROR: no content in response:', json.dumps(r))
              sys.exit(1)
          if not r.get('forced'):
              print('ERROR: forced=true not in response — token misconfigured or server serving from cache:', json.dumps(r))
              sys.exit(1)
          print('OK: insight generated')
          "

      - name: Fail if any environment returned unavailable
        if: steps.check-dev.outcome == 'failure' || steps.check-prod.outcome == 'failure'
        run: |
          echo "One or more environments failed the insight canary (see output above)."
          echo "Possible causes: provider quota exhausted, all chain models down, kill switch active."
          exit 1

# Proves the AI insight generation path works end to end. A cache hit tells you
# nothing about the provider path, so this forces a live generation and catches a
# broken provider the day it breaks rather than a month later.
#
# Auth: the INSIGHT_ADMIN_TOKEN GitHub secret must match the insight-admin-token
# Secret Manager value in each project, which Terraform wires into frontend-service
# as ADMIN_TOKEN (config/run.tf). Rotate both together. A drifted token cannot force
# generation, which is why `forced` is asserted below rather than just `content`.
# See server/CLAUDE.md for the endpoint contract.
name: CRON Nightly Insight Canary

on:
  schedule:
    - cron: "0 13 * * *" # Daily at 1PM UTC (9AM EST)
  workflow_dispatch:

jobs:
  canary:
    if: github.repository == 'SatcherInstitute/health-equity-tracker'
    name: Force generation (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      # Each environment reports independently: prod being healthy should not
      # hide a broken dev, and vice versa.
      fail-fast: false
      matrix:
        include:
          - env: dev
            host: https://dev.healthequitytracker.org
          - env: prod
            host: https://healthequitytracker.org
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: server/testdata/insight_prompts/card_table_general_population.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Force one uncached insight generation
        env:
          ADMIN_TOKEN: ${{ secrets.INSIGHT_ADMIN_TOKEN }}
          HOST: ${{ matrix.host }}
        run: |
          STATUS=$(curl -s -o /tmp/insight.json -w "%{http_code}" \
            -X POST "$HOST/insight?force=true" \
            -H "Content-Type: application/json" \
            -H "Origin: $HOST" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -d @server/testdata/insight_prompts/card_table_general_population.json)
          echo "HTTP $STATUS"
          cat /tmp/insight.json; echo
          [ "$STATUS" = "200" ] || { echo "Unexpected HTTP $STATUS"; exit 1; }
          # Causes to check on failure: provider quota exhausted, every chain model
          # down, a kill switch set, or ADMIN_TOKEN drifted from Secret Manager.
          jq -e '.content' /tmp/insight.json >/dev/null \
            || { echo "FAIL: no content — generation unavailable"; exit 1; }
          jq -e '.forced' /tmp/insight.json >/dev/null \
            || { echo "FAIL: not forced — bad token, so this was a cache hit and proves nothing"; exit 1; }
          echo "OK: insight generated by a live provider call"
